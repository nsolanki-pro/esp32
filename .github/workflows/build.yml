# Build the firmware in Espressif's ESP-IDF container.
#   - push a tag v*  -> build and publish a GitHub release with the binaries
#   - manual run     -> build; binaries are attached to the run as artifacts
name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags: the firmware version comes from git describe

      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"  # container runs as another user
          . "$IDF_PATH/export.sh"
          idf.py build merge-bin

      - name: Collect binaries
        shell: bash
        run: |
          version=$(git describe --tags --always --dirty)
          name=esp32-$version
          mkdir dist
          cp firmware/build/esp32_status.bin "dist/$name-ota.bin"      # OTA: /update page or ota.sh
          cp firmware/build/merged-binary.bin "dist/$name-full.bin"    # USB: flash at 0x0
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.bin > SHA256SUMS
          # manifest.json: what the device's "install latest release" reads (see firmware/main/update.h).
          # One build since v1.3.0 (motion sensing is a runtime setting); it is also listed as "motion"
          # so devices still running the old separate motion build find their update.
          v=$GITHUB_REF_NAME
          entry() { printf '"%s_ota":"%s","%s_size":%s,"%s_sha256":"%s"' \
                      "$2" "$1" "$2" "$(stat -c %s "$1")" "$2" "$(sha256sum "$1" | cut -d' ' -f1)"; }
          printf '{"version":"%s",%s,%s}\n' "$v" "$(entry "esp32-$v-ota.bin" default)" \
                 "$(entry "esp32-$v-ota.bin" motion)" > manifest.json
          cat manifest.json
          cat > notes.md <<'EOF'
          **Files**
          - `*-ota.bin`: app image for over-the-air updates (`/update` page or `ota.sh`)
          - `*-full.bin`: complete flash image for a new or erased board, written over USB at offset 0:
            `esptool.py --chip esp32 -b 115200 write_flash 0x0 esp32-<version>-full.bin`
          - `manifest.json`: read by the device's *Install latest release* button on `/update`

          After flashing, the board opens the setup network `ESP32-Setup-XXXX` (password `esp32setupXXXX`).
          EOF
          gh release create "$GITHUB_REF_NAME" *.bin SHA256SUMS manifest.json --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
